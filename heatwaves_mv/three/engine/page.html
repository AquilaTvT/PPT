<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import * as P from '/engine/print.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080;
const params = JSON.parse(decodeURIComponent(q.get('params') || '%7B%7D'));
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: q.get('aa') !== '0', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // inks are authored as final sRGB values
THREE.ColorManagement.enabled = false;
for (const [fam, file] of [['Shippori', 'ShipporiMincho-ExtraBold.ttf'], ['DotGothic', 'DotGothic16-Regular.ttf'], ['NotoSerifSC', 'NotoSerifSC[wght].ttf']]) {
  try { const ff = new FontFace(fam, `url(/fonts/${encodeURIComponent(file)})`); await ff.load(); document.fonts.add(ff); } catch (e) { console.warn('font', fam, e); }
}
let S;
try {
  const mod = await import('/scenes/' + q.get('scene') + '.js');
  S = await mod.build(THREE, P, params, { W, H });
} catch (e) { window.buildError = String(e && e.stack || e); throw e; }
let jit = [0, 0];
window.renderAt = (t, beatPulse = 0, frameIdx = 0) => {
  P.U.uTime.value = t;
  P.U.uPulse.value = beatPulse;
  if (frameIdx % 3 === 0) {                     // print jitter: re-registration every 3 frames
    const h = Math.sin(frameIdx * 12.9898) * 43758.5453;
    jit = [Math.round((h - Math.floor(h)) * 2 - 1), Math.round(((h * 7.31) % 1 + 1) % 1 * 2 - 1)];
  }
  P.U.uJitter.value.set(jit[0], jit[1]);
  S.update(t, beatPulse);
  renderer.render(S.scene, S.camera);
  return canvas.toDataURL('image/png');
};
// projected screen-space points of named 3D anchors (for 2D inserts in the compositor)
window.anchors = () => {
  if (!S.anchors) return null;
  const out = {};
  for (const [k, pts] of Object.entries(S.anchors())) {
    out[k] = pts.map(p => { const v = p.clone().project(S.camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, v.z]; });
  }
  return out;
};
window.ready = true;
</script></body></html>
